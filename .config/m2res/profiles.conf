# m2res-profile: профили райса. Обычный shell-файл; профиль <имя> = набор переменных P_<имя>_*.
#   ACCENT  #rrggbb акцент (m2res-accent set); пусто — не менять
#   WALL    путь к картинке для обоев (hyprpaper); пусто — не менять (акцент при этом ставится явно)
#   DND     1 — «не беспокоить» (mako), 0 — выключить
#   POWER   performance|balanced|power-saver; пусто — не менять
#   LAYOUT  раскладка ТЕКУЩЕГО стола: dwindle|scrolling|center|monocle; пусто — не менять
#   NIGHT   on|off ночной свет (sunsetr); пусто — не менять
#   GAME    1 — включить игровой режим (m2res-game), 0 — выключить
PROFILES="work game movie"
P_work_ACCENT="#b0d500"; P_work_DND=0; P_work_POWER="performance"; P_work_LAYOUT="dwindle"; P_work_NIGHT="on";  P_work_GAME=0
P_game_ACCENT="#ff5c7a"; P_game_DND=1; P_game_POWER="performance"; P_game_LAYOUT="";        P_game_NIGHT="off"; P_game_GAME=1
P_movie_ACCENT="#ffb347"; P_movie_DND=1; P_movie_POWER="balanced"; P_movie_LAYOUT="monocle"; P_movie_NIGHT="on";  P_movie_GAME=0
