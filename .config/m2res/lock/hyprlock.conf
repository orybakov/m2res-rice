# m2res lock: «HUD» — живая телеметрия, анимированный сканер и эквалайзер, глитч-заголовок.
# Данные для label'ов пишет демон m2res-lockfx (запускает невидимый label ниже, сам выходит после разблокировки).
# Прежняя версия «ретро-ТВ»: hyprlock.conf.bak-tv
source = ~/.config/m2res/lock/colors.conf

$font = CaskaydiaMono Nerd Font Mono
source = ~/.config/m2res/lock/rice.conf
$fx   = $XDG_RUNTIME_DIR/m2res-lock

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = out, 0.16, 1.0, 0.3, 1.0
    bezier = spring, 0.34, 1.56, 0.64, 1.0
    animation = fadeIn, 1, 6, out
    animation = fadeOut, 1, 4, out
    animation = inputFieldDots, 1, 2, spring
    animation = inputFieldColors, 1, 4, out
    animation = inputFieldFade, 1, 4, out
    animation = inputFieldWidth, 1, 5, spring
}

background {
    monitor =
    path = ~/.config/m2res/wallpapers/current.png
    color = $lock_bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.38
    contrast = 1.05
    vibrancy = 0.12
    noise = 0.015
}

# ---------- запуск демона кадров (пустой текст) ----------
label {
    monitor =
    text = cmd[update:1500] ~/.config/m2res/scripts/m2res-lockfx ensure
    font_size = 1
    color = rgba(00000000)
    position = 0, 0
    halign = left
    valign = top
}

# ---------- уголки-скобки ----------
shape { monitor =
    size = 120, 5
    color = $accent
    position = 60, -60
    halign = left
    valign = top
}
shape { monitor =
    size = 5, 120
    color = $accent
    position = 60, -60
    halign = left
    valign = top
}
shape { monitor =
    size = 120, 5
    color = $accent
    position = -60, -60
    halign = right
    valign = top
}
shape { monitor =
    size = 5, 120
    color = $accent
    position = -60, -60
    halign = right
    valign = top
}
shape { monitor =
    size = 120, 5
    color = $accent
    position = 60, 60
    halign = left
    valign = bottom
}
shape { monitor =
    size = 5, 120
    color = $accent
    position = 60, 60
    halign = left
    valign = bottom
}
shape { monitor =
    size = 120, 5
    color = $accent
    position = -60, 60
    halign = right
    valign = bottom
}
shape { monitor =
    size = 5, 120
    color = $accent
    position = -60, 60
    halign = right
    valign = bottom
}

# ---------- потоки данных сверху/снизу ----------
label {
    monitor =
    text = cmd[update:90] cat $fx/tick_top
    font_size = 18
    font_family = $font
    color = $accent
    position = 0, 640
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:90] cat $fx/tick_bot
    font_size = 18
    font_family = $font
    color = $accent
    position = 0, -640
    halign = center
    valign = center
}

# ---------- центр: заголовок, часы, дата ----------
label {
    monitor =
    text = cmd[update:85] cat $fx/title
    font_size = 34
    font_family = $font Bold
    position = 0, 470
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:200] cat $fx/clock
    font_size = 290
    font_family = $font Bold
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:200] cat $fx/secbar
    font_size = 24
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:20000] cat $fx/date
    font_size = 34
    font_family = $font Bold
    position = 0, -35
    halign = center
    valign = center
}

# ---------- центр: ввод пароля ----------
label {
    monitor =
    text = <span foreground="##8a8d80">AUTH ▸ </span><span foreground="##d4ff00"><b>$USER</b></span>
    font_size = 22
    font_family = $font
    position = 0, -105
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 820, 96
    outline_thickness = 5
    outer_color = rgba(000000ff)
    inner_color = $lock_inner
    font_color = $lock_text
    check_color = $accent
    fail_color = rgba(ff4d6dff)
    capslock_color = rgba(ffd166ff)
    numlock_color = rgba(ffd166ff)
    bothlock_color = rgba(ffd166ff)
    fade_on_empty = false
    rounding = -1
    dots_size = 0.30
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1
    font_family = $font Bold
    placeholder_text = <span foreground="##6b6e63">ВВЕДИТЕ ПАРОЛЬ</span>
    fail_text = <span foreground="##ff4d6d"><b>ДОСТУП ЗАПРЕЩЁН</b></span>
    check_text = <span foreground="##b0d500">ПРОВЕРКА…</span>
    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(b0d50040)
    position = 0, -200
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:85] cat $fx/scan
    font_size = 21
    font_family = $font
    position = 0, -290
    halign = center
    valign = center
}
label {
    monitor =
    text = <span foreground="##6b6e63">ПОПЫТОК </span><span foreground="##ececE6">$ATTEMPTS[0]</span><span foreground="##6b6e63">    РАСКЛАДКА </span><span foreground="##ececE6">$LAYOUT</span>
    font_size = 20
    font_family = $font
    position = 0, -335
    halign = center
    valign = center
}

# причина отказа от PAM (в т.ч. «аккаунт временно заблокирован» от faillock) — показывается только после неудачи
label {
    monitor =
    text = <span foreground="##ff4d6d"><b>$FAIL</b></span>
    font_size = 22
    font_family = $font
    position = 0, -385
    halign = center
    valign = center
}

# ---------- эквалайзер и входящие ----------
label {
    monitor =
    text = cmd[update:85] cat $fx/wave
    font_size = 38
    font_family = $font
    position = 0, -470
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:2000] cat $fx/notif
    font_size = 24
    font_family = $font
    position = 0, -560
    halign = center
    valign = center
}

# ---------- левая колонка: система и плеер ----------
shape {
    monitor =
    size = 1000, 440
    color = $lock_panel
    rounding = 26
    border_size = 3
    border_color = rgba(b0d50066)
    position = 180, 190
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] cat $fx/sys
    font_size = 26
    font_family = $font
    text_align = left
    zindex = 3
    position = 235, 190
    halign = left
    valign = center
}
shape {
    monitor =
    size = 1000, 330
    color = $lock_panel
    rounding = 26
    border_size = 3
    border_color = rgba(b0d50066)
    position = 180, -250
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] cat $fx/player
    font_size = 26
    font_family = $font
    text_align = left
    zindex = 3
    position = 235, -250
    halign = left
    valign = center
}
