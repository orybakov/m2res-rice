# m2res-preset: раскладки столов и пресеты запуска. Применяется при старте Hyprland и командой `m2res-preset apply`.
# WS_<номер>=dwindle|scrolling|center|monocle     dwindle — обычное деление пополам; scrolling — колонки с прокруткой (для 32:9);
#                                                 center — главное окно по центру, остальные по бокам; monocle — одно окно на весь стол
WS_3=scrolling
# Ширина колонки в режиме scrolling: на ультрашироком (≥2.2:1) — треть экрана, иначе половина
COL_WIDE=0.333
COL_NORMAL=0.5
# Ширина главного окна в режиме center
CENTER_MFACT=0.5
# Пресеты запуска (m2res-preset launch <имя>): команды через «;», каждая откроется отдельным окном на текущем столе
PRESET_dev="ghostty; ghostty; ghostty"
PRESET_web="google-chrome-stable; ghostty"
