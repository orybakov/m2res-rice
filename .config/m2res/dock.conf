# m2res-dock: боковая панель для 32:9 (SUPER+SHIFT+B — показать/скрыть)
SIDE=left          # left | right
AUTOHIDE=1         # 1 — панель прячется и выезжает при наведении курсора на край экрана; 0 — висит всегда
EDGE=4             # толщина невидимой зоны у края, px
HIDE_MS=450        # через сколько мс после ухода курсора панель прячется
EXCLUSIVE=0        # 1 — окна не заходят под панель (работает только при AUTOHIDE=0)
AUTOSTART=1        # 1 — запускать при входе (только на мониторах шире 2.2:1)
