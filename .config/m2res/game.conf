# m2res-game: что дополнительно освобождать при включении игрового режима. Это обычный shell-файл.
# Юниты systemd (user), которые остановить; при выключении поднимаются обратно, если были активны.
# Локальная LLM держит ~10 ГБ VRAM — раскомментируйте, если нужно (перезагрузка модели занимает время):
GAME_STOP_UNITS=""
# Классы окон (hyprctl clients), которые вежливо закрыть. НЕ восстанавливаются, несохранённое может пропасть:
GAME_CLOSE_CLASSES=""
#GAME_CLOSE_CLASSES="org.telegram.desktop"
# Останавливать hyprpaper (освобождает память GPU; на время игры фон — сплошной цвет): 1 — да, 0 — нет
GAME_STOP_WALLPAPER=1
# Автоматический игровой режим (m2res-autogame): включается, когда окно игры уходит в полноэкранный режим, выключается, когда оно закрылось
# или вышло из fullscreen. Вручную включённый режим демон не трогает. 1 — работает, 0 — демон бездействует.
GAME_AUTO=1
# Классы окон-игр (регулярное выражение, ищется в class). Steam-игры в Proton/Linux имеют класс steam_app_<id>; gamescope — оконная обёртка.
GAME_AUTO_CLASSES='^(steam_app_[0-9]+|gamescope|.*\.exe)$'
# Сколько секунд ждать после выхода из fullscreen перед выключением (чтобы alt-tab не дёргал режим)
GAME_AUTO_OFF_DELAY=6
